name: Repair Youngster PNG
on:
  push:
    branches: [feature/gen2-sprite-conversions]
    paths:
      - scripts/draw_firered_youngster_manual.py
      - .github/workflows/repair-youngster-png.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Regenerate valid PNG from pixel instructions
        run: python scripts/draw_firered_youngster_manual.py
      - name: Commit repaired PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfx/trainers/conversions/youngster_firered_manual_prototype.png
          if ! git diff --cached --quiet; then
            git commit -m "fix: regenerate valid manual Youngster PNG"
            git push
          fi
