name: Import migration workspace
on:
  push:
    branches: [master]
    paths: [.github/workflows/import-migration-workspace.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Extract and verify original source archive
        shell: python
        run: |
          import os, pathlib, subprocess, zipfile
          paths = []
          with zipfile.ZipFile("polishedcrystal-16bit-migration-workspace-final-20260919.zip") as z:
              for item in z.infolist():
                  if item.is_dir():
                      continue
                  parts = pathlib.PurePosixPath(item.filename).parts[1:]
                  assert parts and ".." not in parts and ".git" not in parts
                  path = pathlib.Path(*parts)
                  assert not path.is_absolute()
                  path.parent.mkdir(parents=True, exist_ok=True)
                  data = z.read(item)
                  path.write_bytes(data)
                  os.chmod(path, (item.external_attr >> 16) & 0o777 or 0o644)
                  assert path.read_bytes() == data
                  paths.append(str(path))
          assert len(paths) == 7864, len(paths)
          for offset in range(0, len(paths), 100):
              subprocess.run(["git", "add", "--force", "--", *paths[offset:offset+100]], check=True)
          print(f"Verified and staged {len(paths)} source files.")
      - name: Commit source files to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Import complete original 16-bit migration workspace"
            git push origin HEAD:master
          fi
