name: 16-bit migration

on:
  push:
    branches: [migration/danielolivaw-16bit]
  pull_request:
    branches: [migration/danielolivaw-16bit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: normal, flags: '', tests: true }
          - { name: debug, flags: debug, tests: true }
          - { name: faithful, flags: faithful, tests: false }
          - { name: faithful-debug, flags: 'faithful debug', tests: false }
          - { name: vc, flags: vc, tests: false }
          - { name: faithful-vc, flags: 'faithful vc', tests: false }
          - { name: debug-vc, flags: 'debug vc', tests: false }
          - { name: faithful-debug-vc, flags: 'faithful debug vc', tests: false }
          - { name: native-0201, flags: 'native-test NATIVE_TEST_SPECIES=513', tests: false, fixture: true }
          - { name: native-02fd, flags: 'native-test NATIVE_TEST_SPECIES=765', tests: false, fixture: true }
          - { name: native-02fe, flags: 'native-test NATIVE_TEST_SPECIES=766', tests: false, fixture: true }
          - { name: native-02ff, flags: 'native-test NATIVE_TEST_SPECIES=767', tests: false, fixture: true }
          - { name: native-0300, flags: 'native-test NATIVE_TEST_SPECIES=768', tests: false, fixture: true }
          - { name: move-0100, flags: 'native_move_test=1 NATIVE_TEST_MOVE=256', tests: false, moves: true }
          - { name: move-0101, flags: 'native_move_test=1 NATIVE_TEST_MOVE=257', tests: false, moves: true }
          - { name: move-01fd, flags: 'native_move_test=1 NATIVE_TEST_MOVE=509', tests: false, moves: true }
          - { name: move-01fe, flags: 'native_move_test=1 NATIVE_TEST_MOVE=510', tests: false, moves: true }
          - { name: move-01ff, flags: 'native_move_test=1 NATIVE_TEST_MOVE=511', tests: false, moves: true }
          - { name: move-0200, flags: 'native_move_test=1 NATIVE_TEST_MOVE=512', tests: false, moves: true }
          - { name: move-fd01, flags: 'native_move_test=1 NATIVE_TEST_MOVE=64769', tests: false, moves: true }
          - { name: move-feff, flags: 'native_move_test=1 NATIVE_TEST_MOVE=65279', tests: false, moves: true }
          - { name: combined-02ff-fffe, flags: 'native-test NATIVE_TEST_SPECIES=767 native_move_test=1 NATIVE_TEST_MOVE=65534', tests: false, fixture: true, moves: true }
          - { name: gameplay-02ff-fd01, flags: 'native-test NATIVE_TEST_SPECIES=767 native_move_test=1 NATIVE_TEST_MOVE=64769 native_gameplay_test=1', tests: false, fixture: true, moves: true, gameplay: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y bison libpng-dev
      - name: Install RGBDS 1.0.4
        run: |
          git clone --depth 1 --branch v1.0.4 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -C /tmp/rgbds -j2
          sudo make -C /tmp/rgbds install
      - name: Build
        env:
          BUILD_FLAGS: ${{ matrix.flags }}
        run: make -j2 $BUILD_FLAGS
      - name: Install CPU test dependency
        if: matrix.tests || matrix.fixture || matrix.moves
        run: python -m pip install pyboy==2.7.0
      - name: Install gameplay screenshot dependency
        if: matrix.gameplay
        run: python -m pip install Pillow==13.0.0
      - name: Audit move ID boundaries
        run: python tools/audit_move_ids.py
      - name: Audit hook safety
        if: matrix.tests
        run: python tools/audit_future_sight_hooks.py --strict
      - name: CPU regressions
        if: matrix.tests
        shell: bash
        run: |
          roms=(polishedcrystal-*.gbc)
          python tools/run_migration_tests.py "${roms[0]}" --jobs 2 --timeout 90
      - name: Wide-species integration
        if: matrix.fixture
        shell: bash
        run: |
          roms=(polishedcrystal-native-test-*.gbc)
          python tests/fixtures/wide_species.py "${roms[0]}"
          python tests/test_native_link_packets.py "${roms[0]}"
          python tests/test_scripted_native_encounters.py "${roms[0]}"
          python tests/test_native_post_battle.py "${roms[0]}"
          python tests/test_native_trainer_daycare.py "${roms[0]}"
      - name: Wide-move integration
        if: matrix.moves
        shell: bash
        run: |
          roms=(polishedcrystal-*.gbc)
          python tests/test_native_move_ids.py "${roms[0]}"
          python tests/test_native_link_packets.py "${roms[0]}"
      - name: Joypad battles, storage, evolution, hatching and cold reload
        if: matrix.gameplay
        shell: bash
        run: |
          roms=(polishedcrystal-native-test-*.gbc)
          python tests/fixtures/native_gameplay.py "${roms[0]}"
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-${{ matrix.name }}-${{ github.sha }}
          path: |
            polishedcrystal-*.gbc
            polishedcrystal-*.sym
            polishedcrystal-*.map
            polishedcrystal-*.patch
            build/test-results/
