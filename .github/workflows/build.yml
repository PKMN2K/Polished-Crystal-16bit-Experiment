# Continuous Integration Workflow
name: "CI Build"

on:
  pull_request:
    branches:
      - master
  workflow_call:

env:
  # PC_VERSION should match VERSION in Makefile
  PC_VERSION: "3.2.3"
  RGBDS_VERSION: "v1.0.3"

jobs:
  build-ubuntu:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      # SET ENVIRONMENT VARIABLES
      - id: set-env-var
        name: "Set environment variables"
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      # INSTALL DEPENDENCIES
      - id: apt-get-depends
        name: "Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install bison gcc git make libpng-dev -y;

      # CHECKOUT RGBDS
      - id: checkout-rgbds
        name: "Checkout gbdev/rgbds"
        uses: actions/checkout@v7
        with:
          path: rgbds
          ref: ${{ env.RGBDS_VERSION }}
          repository: gbdev/rgbds

      # INSTALL RGBDS
      - id: install-rgbds
        name: "Install gbdev/rgbds"
        working-directory: rgbds
        run: |
          sudo make install

      # CHECKOUT REPOSITORY
      - id: checkout-polishedcrystal
        name: "Checkout Rangi42/polishedcrystal"
        uses: actions/checkout@v7

      # FOCUSED SPECIES-MIGRATION RUNTIME TESTS
      - id: setup-python-migration-tests
        name: "Set up Python for native species CPU tests"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: install-pyboy-migration-tests
        name: "Install PyBoy for native species CPU tests"
        run: python -m pip install pyboy==2.7.0

      # BUILD ROMS
      - id: build-polishedcrystal
        name: "Build polishedcrystal"
        run: |
          make -j$(nproc)
          mkdir build
          mv polishedcrystal-${{ env.PC_VERSION }}.gbc build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc
          mv polishedcrystal-${{ env.PC_VERSION }}.sym build/polishedcrystal-dev-${{ env.SHORT_SHA }}.sym
          make tidy

      - id: test-native-move-animation-cry
        name: "Test native move-animation cries (normal)"
        run: python tests/test_native_move_animation_cry.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-transform-picture
        name: "Test native Transform animation picture (normal)"
        run: python tests/test_transform_animation_native_picture.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-ghost-reveal-picture
        name: "Test native ghost-reveal picture and Dex (normal)"
        run: python tests/test_native_ghost_reveal_picture.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-sendout-tempmon
        name: "Test native enemy send-out temporary record (normal)"
        run: python tests/test_native_enemy_sendout_tempmon.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-frontpic-renderer
        name: "Test native enemy frontpic renderer (normal)"
        run: python tests/test_native_enemy_frontpic_renderer.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-frontpic-vram
        name: "Test real native enemy frontpic VRAM transfer (normal)"
        run: python tests/test_native_enemy_frontpic_vram.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-frontpic-vblank
        name: "Test LCD-on native enemy frontpic VBlank transfer (normal)"
        run: python tests/test_native_enemy_frontpic_vblank.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-sendout-integration
        name: "Test native enemy send-out picture/animation integration (normal)"
        run: python tests/test_native_enemy_sendout_integration.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-wild-battle-intro-integration
        name: "Test native wild-battle intro integration (normal)"
        run: python tests/test_native_wild_battle_intro_integration.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-battle-intro-wild-smoke
        name: "Test single-entry native BattleIntro wild smoke (normal)"
        run: python tests/test_native_battle_intro_wild_smoke.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-do-battle-entry-smoke
        name: "Test native DoBattle entry smoke (normal)"
        run: python tests/test_native_do_battle_entry_smoke.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-first-battle-turn-smoke
        name: "Test native first BattleTurn setup smoke (normal)"
        run: python tests/test_native_first_battle_turn_smoke.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-player-action-move-selection-smoke
        name: "Test native player action move-selection boundary (normal)"
        run: python tests/test_native_player_action_move_selection_smoke.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-selected-move-order-boundary
        name: "Test native selected-move to move-order boundary (normal)"
        run: python tests/test_native_selected_move_order_boundary.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-perform-move-entry-boundary
        name: "Test native move-order to PerformMove entry boundary (normal)"
        run: python tests/test_native_perform_move_entry_boundary.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-do-turn-initialize-boundary
        name: "Test native DoTurn initialization boundary (normal)"
        run: python tests/test_native_do_turn_initialize_boundary.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-first-effect-command-boundary
        name: "Test native first effect-command boundary (normal)"
        run: python tests/test_native_first_effect_command_boundary.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-frontpic-dimensions
        name: "Test native enemy frontpic animation dimensions (normal)"
        run: python tests/test_native_enemy_frontpic_dimensions.py build/polishedcrystal-dev-${{ env.SHORT_SHA }}.gbc

      - id: build-polishedcrystal-faithful
        name: "Build polishedcrystal-faithful"
        run: |
          make -j$(nproc) faithful
          mv polishedcrystal-faithful-${{ env.PC_VERSION }}.gbc build/polishedcrystal-faithful-dev-${{ env.SHORT_SHA }}.gbc
          mv polishedcrystal-faithful-${{ env.PC_VERSION }}.sym build/polishedcrystal-faithful-dev-${{ env.SHORT_SHA }}.sym
          make tidy

      # BUILD VC PATCHES
      - id: build-polishedcrystal-vc
        name: "Build polishedcrystal vc"
        run: |
          make -j$(nproc) vc
          mv polishedcrystal-${{ env.PC_VERSION }}_vc.gbc build/polishedcrystal-dev-${{ env.SHORT_SHA }}_vc.gbc
          mv polishedcrystal-${{ env.PC_VERSION }}.patch build/polishedcrystal-dev-${{ env.SHORT_SHA }}.patch
          mv polishedcrystal-${{ env.PC_VERSION }}_vc.sym build/polishedcrystal-dev-${{ env.SHORT_SHA }}_vc.sym
          make tidy

      - id: build-polishedcrystal-faithful-vc
        name: "Build polishedcrystal-faithful vc"
        run: |
          make -j$(nproc) faithful vc
          mv polishedcrystal-faithful-${{ env.PC_VERSION }}.gbc build/polishedcrystal-faithful-dev-${{ env.SHORT_SHA }}_vc.gbc
          mv polishedcrystal-faithful-${{ env.PC_VERSION }}.patch build/polishedcrystal-faithful-dev-${{ env.SHORT_SHA }}.patch
          mv polishedcrystal-faithful-${{ env.PC_VERSION }}.sym build/polishedcrystal-faithful-dev-${{ env.SHORT_SHA }}_vc.sym
          make tidy

      # BUILD DEBUG ROMS
      - id: build-polisheddebug
        name: "Build polisheddebug"
        run: |
          make -j$(nproc) debug vc
          mv polishedcrystal-debug-${{ env.PC_VERSION }}.gbc build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc
          mv polishedcrystal-debug-${{ env.PC_VERSION }}.sym build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.sym
          make tidy

      - id: test-native-move-animation-cry-debug
        name: "Test native move-animation cries (debug)"
        run: python tests/test_native_move_animation_cry.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-transform-picture-debug
        name: "Test native Transform animation picture (debug)"
        run: python tests/test_transform_animation_native_picture.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-ghost-reveal-picture-debug
        name: "Test native ghost-reveal picture and Dex (debug)"
        run: python tests/test_native_ghost_reveal_picture.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-sendout-tempmon-debug
        name: "Test native enemy send-out temporary record (debug)"
        run: python tests/test_native_enemy_sendout_tempmon.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-frontpic-renderer-debug
        name: "Test native enemy frontpic renderer (debug)"
        run: python tests/test_native_enemy_frontpic_renderer.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-frontpic-vram-debug
        name: "Test real native enemy frontpic VRAM transfer (debug)"
        run: python tests/test_native_enemy_frontpic_vram.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-frontpic-vblank-debug
        name: "Test LCD-on native enemy frontpic VBlank transfer (debug)"
        run: python tests/test_native_enemy_frontpic_vblank.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-sendout-integration-debug
        name: "Test native enemy send-out picture/animation integration (debug)"
        run: python tests/test_native_enemy_sendout_integration.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-wild-battle-intro-integration-debug
        name: "Test native wild-battle intro integration (debug)"
        run: python tests/test_native_wild_battle_intro_integration.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-battle-intro-wild-smoke-debug
        name: "Test single-entry native BattleIntro wild smoke (debug)"
        run: python tests/test_native_battle_intro_wild_smoke.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-do-battle-entry-smoke-debug
        name: "Test native DoBattle entry smoke (debug)"
        run: python tests/test_native_do_battle_entry_smoke.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-first-battle-turn-smoke-debug
        name: "Test native first BattleTurn setup smoke (debug)"
        run: python tests/test_native_first_battle_turn_smoke.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-player-action-move-selection-smoke-debug
        name: "Test native player action move-selection boundary (debug)"
        run: python tests/test_native_player_action_move_selection_smoke.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-selected-move-order-boundary-debug
        name: "Test native selected-move to move-order boundary (debug)"
        run: python tests/test_native_selected_move_order_boundary.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-perform-move-entry-boundary-debug
        name: "Test native move-order to PerformMove entry boundary (debug)"
        run: python tests/test_native_perform_move_entry_boundary.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-do-turn-initialize-boundary-debug
        name: "Test native DoTurn initialization boundary (debug)"
        run: python tests/test_native_do_turn_initialize_boundary.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-first-effect-command-boundary-debug
        name: "Test native first effect-command boundary (debug)"
        run: python tests/test_native_first_effect_command_boundary.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: test-native-enemy-frontpic-dimensions-debug
        name: "Test native enemy frontpic animation dimensions (debug)"
        run: python tests/test_native_enemy_frontpic_dimensions.py build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.gbc

      - id: build-polisheddebug-faithful
        name: "Build polisheddebug-faithful"
        run: |
          make -j$(nproc) faithful debug vc
          mv polishedcrystal-faithful-debug-${{ env.PC_VERSION }}.gbc build/polishedcrystal-faithful-debug-dev-${{ env.SHORT_SHA }}.gbc
          mv polishedcrystal-faithful-debug-${{ env.PC_VERSION }}.sym build/polishedcrystal-faithful-debug-dev-${{ env.SHORT_SHA }}.sym
          make tidy

      - id: build-polisheddebug-vc
        name: "Build polisheddebug vc"
        run: |
          make -j$(nproc) debug vc
          mv polishedcrystal-debug-${{ env.PC_VERSION }}_vc.gbc build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}_vc.gbc
          mv polishedcrystal-debug-${{ env.PC_VERSION }}.patch build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.patch
          mv polishedcrystal-debug-${{ env.PC_VERSION }}_vc.sym build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}_vc.sym
          make tidy

      - id: build-polisheddebug-faithful-vc
        name: "Build polisheddebug-faithful vc"
        run: |
          make -j$(nproc) faithful debug vc
          mv polishedcrystal-faithful-debug-${{ env.PC_VERSION }}_vc.gbc build/polishedcrystal-faithful-debug-dev-${{ env.SHORT_SHA }}_vc.gbc
          mv polishedcrystal-faithful-debug-${{ env.PC_VERSION }}.patch build/polishedcrystal-faithful-debug-dev-${{ env.SHORT_SHA }}.patch
          mv polishedcrystal-faithful-debug-${{ env.PC_VERSION }}_vc.sym build/polishedcrystal-faithful-debug-dev-${{ env.SHORT_SHA }}_vc.sym
          make tidy

      # UPLOAD ARTIFACTS – only if the repo is owned by Rangi42 (i.e., not a fork)
      - id: upload-polishedcrystal
        if: ${{ github.repository_owner == 'Rangi42' }}
        name: "Upload polishedcrystal artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: "polishedcrystal"
          retention-days: 1
          path: |
            build/polishedcrystal-dev-${{ env.SHORT_SHA }}.*

      - id: upload-polishedcrystal-faithful
        if: ${{ github.repository_owner == 'Rangi42' }}
        name: "Upload polishedcrystal-faithful artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: "polishedcrystal-faithful"
          retention-days: 1
          path: |
            build/polishedcrystal-faithful-dev-${{ env.SHORT_SHA }}.*

      - id: upload-polisheddebug
        if: ${{ github.repository_owner == 'Rangi42' }}
        name: "Upload polisheddebug artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: "polisheddebug"
          retention-days: 1
          path: |
            build/polishedcrystal-debug-dev-${{ env.SHORT_SHA }}.*

      - id: upload-polisheddebug-faithful
        if: ${{ github.repository_owner == 'Rangi42' }}
        name: "Upload polisheddebug-faithful artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: "polisheddebug-faithful"
          retention-days: 1
          path: |
            build/polishedcrystal-faithful-debug-dev-${{ env.SHORT_SHA }}.*
